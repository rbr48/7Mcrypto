[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "4d-crypto-risk"
version = "1.0.0"
description = "4D Multidisciplinary Global Risk Forecasting Framework for Cryptocurrency Markets"
readme = "README.md"
authors = [{ name = "Izhaan Intellect Research" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "scipy>=1.8.0",
    "lightgbm>=3.3.0",
    "matplotlib>=3.5.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
