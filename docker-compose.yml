version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 4d-crypto-risk-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8135:8000"
    environment:
      - PORT=8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
